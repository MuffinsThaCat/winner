[package]
name = "williams-hybrid-complete"
version = "1.0.0"
edition = "2021"

[features]
default = []
bench = []  # Disable verbose logging for benchmarking
quiet = []  # Minimal output for maximum performance

[dependencies]
revm = { version = "10.0", default-features = false, features = ["std", "secp256k1"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.13"
rayon = "1.8"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1.35", features = ["full"] }
sha3 = "0.10"
lru = "0.12"
parking_lot = "0.12"
rustc-hash = "2.0"
mimalloc = { version = "0.1", default-features = false }
dashmap = "5.5"

[[bin]]
name = "williams-complete"
path = "src/main.rs"

[profile.release]
opt-level = 3              # Maximum optimization
lto = "fat"                # Full Link-Time Optimization across all crates
codegen-units = 1          # Better optimization, slower compile
panic = "abort"            # Smaller binary, faster unwinding
strip = true               # Strip debug symbols
debug = false              # No debug info in release

[profile.release.build-override]
opt-level = 3

# Profile for PGO instrumentation
[profile.pgo-instrument]
inherits = "release"
codegen-units = 1

# Profile for PGO-optimized build
[profile.pgo-optimize]
inherits = "release"
codegen-units = 1
