[package]
name = "williams-hybrid-complete"
version = "1.0.0"
edition = "2021"

[dependencies]
revm = { version = "10.0", default-features = false, features = ["std", "secp256k1"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1.35", features = ["full"] }
sha3 = "0.10"
lru = "0.12"
parking_lot = "0.12"

[[bin]]
name = "williams-complete"
path = "src/main.rs"
