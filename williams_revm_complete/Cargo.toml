[package]
name = "williams-hybrid-complete"
version = "1.0.0"
edition = "2021"

[features]
default = []
bench = []  # Pure benchmark mode - maximum TPS, minimal observability
production = ["logging", "metrics", "resilience", "signatures"]  # Full production features
logging = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-appender"]
metrics = ["dep:prometheus"]
resilience = ["dep:backoff"]
signatures = ["dep:secp256k1"]  # ECDSA signature verification

[dependencies]
revm = { version = "10.0", default-features = false, features = ["std", "secp256k1"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.13"
rayon = "1.8"
hex = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1.35", features = ["full"] }
sha3 = "0.10"
lru = "0.12"
parking_lot = "0.12"
rustc-hash = "2.0"
mimalloc = { version = "0.1", default-features = false }
dashmap = "5.5"
bumpalo = "3.14"  # Arena allocator for memory pooling
bloomfilter = "1.0"  # Fast existence checks
snap = "1.1"  # Snappy compression (fast)
zstd = { version = "0.13", features = ["zstdmt"] }  # Zstd compression (high ratio)
once_cell = "1.19"  # Static initialization for env templates

# Optional production dependencies (zero cost if not enabled)
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
tracing-appender = { version = "0.2", optional = true }
prometheus = { version = "0.13", optional = true }
backoff = { version = "0.4", optional = true }
secp256k1 = { version = "0.28", features = ["recovery"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"

[lib]
name = "williams_hybrid_complete"
path = "src/lib.rs"

[[bin]]
name = "williams-complete"
path = "src/main.rs"

[[bench]]
name = "executor_bench"
harness = false

[profile.release]
opt-level = 3              # Maximum optimization
lto = "fat"                # Full Link-Time Optimization across all crates
codegen-units = 1          # Better optimization, slower compile
panic = "abort"            # Smaller binary, faster unwinding
strip = false              # Keep symbols for profiling
debug = 1                  # Minimal debug info for profiling (line numbers)

[profile.release.build-override]
opt-level = 3

# Profile for PGO instrumentation
[profile.pgo-instrument]
inherits = "release"
codegen-units = 1

# Profile for PGO-optimized build
[profile.pgo-optimize]
inherits = "release"
codegen-units = 1
